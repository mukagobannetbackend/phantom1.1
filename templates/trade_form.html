{% extends 'base.html' %}{% block heading %}{{ 'Edit trade' if trade else 'Log a trade' }}{% endblock %}{% block content %}<form class="panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-section"><div class="eyebrow">IDENTITY</div><label>Symbol<input name="symbol" required value="{{ trade.symbol if trade else '' }}"></label><label>Trade date/time<input type="datetime-local" name="trade_date" value="{{ trade.trade_date.strftime('%Y-%m-%dT%H:%M') if trade else '' }}"></label><label>Direction<select name="direction"><option>Long</option><option {% if trade and trade.direction=='Short' %}selected{% endif %}>Short</option></select></label><label>Session<input name="session" placeholder="London / NY / Asia" value="{{ trade.session if trade else '' }}"></label><label>Setup tag<input name="setup" placeholder="e.g. MSS + FVG" value="{{ trade.setup if trade else '' }}"></label></div><div class="form-section"><div class="eyebrow">RISK PLAN</div><label>Entry<input type="number" step="any" name="entry" value="{{ trade.entry if trade and trade.entry is not none else '' }}"></label><label>Stop loss<input type="number" step="any" name="stop_loss" value="{{ trade.stop_loss if trade and trade.stop_loss is not none else '' }}"></label><label>Take profit<input type="number" step="any" name="take_profit" value="{{ trade.take_profit if trade and trade.take_profit is not none else '' }}"></label><label>Planned R<input type="number" step="any" name="planned_r" value="{{ trade.planned_r if trade and trade.planned_r is not none else '' }}"></label><label>Realized R<input type="number" step="any" name="realized_r" value="{{ trade.realized_r if trade and trade.realized_r is not none else '' }}"></label><label>Outcome<select name="outcome">{% for x in ['Open','Win','Loss','Breakeven'] %}<option {% if trade and trade.outcome==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label></div><div class="form-section"><div class="eyebrow">REVIEW</div><label>Emotion<input name="emotion" placeholder="Calm / rushed / uncertain" value="{{ trade.emotion if trade else '' }}"></label><label class="check"><input type="checkbox" name="rule_adherence" {% if trade and trade.rule_adherence %}checked{% endif %}> Followed the rules</label><label>Exit rationale<textarea name="exit_rationale">{{ trade.exit_rationale if trade else '' }}</textarea></label><label>Lessons<textarea name="lessons">{{ trade.lessons if trade else '' }}</textarea></label></div><div class="form-actions"><button class="button primary">Save workspace</button><a class="button" href="{{ url_for('main.trades') }}">Cancel</a></div></form>{% endblock %}
